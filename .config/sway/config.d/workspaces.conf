# Workspace → output binding
# Ultrawide (left) takes 1-6, laptop (right) takes 7-10
workspace 1 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 2 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 3 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 4 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 5 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 6 output "Dell Inc. Dell U4924DW FLYY0S3" "Samsung Electric Company LS49C95xU HNTL300807"
workspace 7 output eDP-1
workspace 8 output eDP-1
workspace 9 output eDP-1
workspace 10 output eDP-1

# Apps with reliable distinct app_id → assigned to workspace
assign [app_id="^Alacritty$"] workspace number 2
assign [app_id="^org\.gnome\.Evolution$"]  workspace number 7
assign [app_id="^1password$"]              workspace number 8
assign [app_id="^slack$"]                  workspace number 10
# Spotify runs under Xwayland (no app_id) → match X11 class instead
assign [class="^Spotify$"]               workspace number 9
